name: generate snake animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  # allow manual runs
  workflow_dispatch:
  # regenerate whenever main is updated
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # read the GitHub contribution graph of <github_user_name>, render it as a snake game svg
      - name: generate github-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=forgejo-light
            dist/github-snake-dark.svg?palette=forgejo-dark

      # push the content of dist/ to the `output` branch
      # files become available at https://raw.githubusercontent.com/<owner>/<repo>/output/<file>
      - name: push svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
